steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=${_RUN_SERVICE_ACCOUNT}
      - --allow-unauthenticated
      - --execution-environment=gen2
      - --port=8080
      - --cpu=2
      - --memory=4Gi
      - --timeout=900
      - --min-instances=1
      - --max-instances=2
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --add-volume=name=uploads,type=cloud-storage,bucket=${_BUCKET}
      - --add-volume-mount=volume=uploads,mount-path=/mnt/uploads
      - --set-env-vars=APP_ENV=production,APP_NAME=B-Snap API,AI_PROVIDER=gemini,GEMINI_DEFAULT_MODEL=gemini-3.1-flash-lite,UPLOAD_DIR=/mnt/uploads,UPLOAD_MAX_BYTES=31457280,AI_IMAGE_MAX_BYTES=29360128
      - --set-secrets=DATABASE_URL=bsnap-database-url:latest,JWT_SECRET_KEY=bsnap-jwt-secret-key:latest,GEMINI_API_KEY=bsnap-gemini-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}

substitutions:
  _REGION: asia-northeast3
  _REPOSITORY: bsnap
  _SERVICE: bsnap-api
  _RUN_SERVICE_ACCOUNT: bsnap-run@gen-lang-client-0182409260.iam.gserviceaccount.com
  _SQL_INSTANCE: gen-lang-client-0182409260:asia-northeast3:bsnap-postgres
  _BUCKET: gen-lang-client-0182409260-bsnap-uploads

options:
  logging: CLOUD_LOGGING_ONLY
